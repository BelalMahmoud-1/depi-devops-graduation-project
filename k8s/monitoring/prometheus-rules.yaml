apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: amazona-rules
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: cpu-alerts
      rules:
        - alert: HighCPUUsage
          expr: rate(container_cpu_usage_seconds_total{namespace="default"}[2m]) > 0.1
          for: 10s
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage detected"
            description: "Pod {{ $labels.pod }} CPU usage is above 10%"

        - alert: CriticalCPUUsage
          expr: rate(container_cpu_usage_seconds_total{namespace="default"}[2m]) > 0.3
          for: 10s
          labels:
            severity: critical
          annotations:
            summary: "CRITICAL: CPU usage very high"
            description: "Pod {{ $labels.pod }} CPU usage is above 30%"

    - name: instance-alerts
      rules:
        - alert: InstanceDown
          expr: up == 0
          for: 10s
          labels:
            severity: critical
          annotations:
            summary: "Instance {{ $labels.instance }} is down"
            description: "Instance {{ $labels.instance }} is not responding"

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 10s
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not ready"
            description: "Node {{ $labels.node }} is not ready"

    - name: memory-alerts
      rules:
        - alert: HighMemoryUsage
          expr: container_memory_usage_bytes{namespace="default"} / container_memory_limit_bytes{namespace="default"} > 0.7
          for: 10s
          labels:
            severity: warning
          annotations:
            summary: "High memory usage detected"
            description: "Pod {{ $labels.pod }} memory usage is above 70%"

        - alert: CriticalMemoryUsage
          expr: container_memory_usage_bytes{namespace="default"} / container_memory_limit_bytes{namespace="default"} > 0.9
          for: 10s
          labels:
            severity: critical
          annotations:
            summary: "CRITICAL: Memory usage very high"
            description: "Pod {{ $labels.pod }} memory usage is above 90%"

    - name: pod-alerts
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="default"}[5m]) > 0
          for: 10s
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} has restarted multiple times"

        - alert: PodNotReady
          expr: kube_pod_status_phase{phase=~"Failed|Unknown",namespace="default"} > 0
          for: 10s
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.pod }} is in {{ $labels.phase }} state"

    - name: disk-alerts
      rules:
        - alert: DiskSpaceLow
          expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
          for: 10s
          labels:
            severity: warning
          annotations:
            summary: "Disk space is low"
            description: "Disk usage is above 85% on {{ $labels.instance }}"

        - alert: DiskSpaceCritical
          expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.05
          for: 10s
          labels:
            severity: critical
          annotations:
            summary: "CRITICAL: Disk space almost full"
            description: "Disk usage is above 95% on {{ $labels.instance }}"
