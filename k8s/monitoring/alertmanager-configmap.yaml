apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'slack'
      routes:
        - match:
            severity: critical
          receiver: 'slack-critical'
        - match:
            severity: warning
          receiver: 'slack-warnings'
    receivers:
      - name: 'slack'
        slack_configs:
          - api_url: '<SLACK_WEBHOOK_URL>'
            channel: '#amazona-alerts'
            title: 'Amazona Alert: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
            send_resolved: true
      - name: 'slack-critical'
        slack_configs:
          - api_url: '<SLACK_WEBHOOK_URL>'
            channel: '#amazona-alerts'
            title: 'CRITICAL: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
            color: 'danger'
            send_resolved: true
      - name: 'slack-warnings'
        slack_configs:
          - api_url: '<SLACK_WEBHOOK_URL>'
            channel: '#amazona-alerts'
            title: 'WARNING: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
            color: 'warning'
            send_resolved: true
