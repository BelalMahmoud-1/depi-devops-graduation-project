apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init-replicaset
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:6
          command:
            - mongosh
            - "--host"
            - "mongo-0.mongo-headless:27017"
            - "--eval"
            - >
              rs.initiate({
                _id: "rs0",
                members: [
                  { _id: 0, host: "mongo-0.mongo-headless:27017" },
                  { _id: 1, host: "mongo-1.mongo-headless:27017" },
                  { _id: 2, host: "mongo-2.mongo-headless:27017" }
                ]
              })
