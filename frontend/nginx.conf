# =============================================================================
# Amazona Frontend — Nginx Configuration
# Author : Mohamed Abdelkader <muhammadabdelkader@github>
# Project: DEPI DevOps Graduation Project — Deliverable #1 (Dockerize)
#
# This config serves the React SPA with:
#   - React Router support (try_files fallback)
#   - Gzip compression for smaller payloads
#   - Long-lived caching for fingerprinted static assets
#   - Security: deny access to hidden files (.env, .git, etc.)
#   - Proper MIME types via the upstream nginx include
# =============================================================================

server {
    # Listen on port 80 (standard HTTP; TLS termination happens at the load
    # balancer / CloudFront layer in later AWS architecture steps).
    listen       80;
    server_name  localhost;

    # Root directory where Nginx looks for static files.
    # This matches where we copied the React build output in the Dockerfile.
    root   /usr/share/nginx/html;
    index  index.html;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # Compresses responses before sending them to the browser, reducing
    # bandwidth usage and improving page load times.
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;    # Only compress responses larger than 1 KB.
    gzip_proxied    any;
    gzip_comp_level 6;       # Compression level 1–9 (6 is a good balance).
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # -------------------------------------------------------------------------
    # React Router (SPA) Support
    # For any URL that does not match a real file or directory, Nginx falls back
    # to index.html. React Router then reads the URL and renders the correct
    # component — this is what makes client-side routing work in a containerised
    # deployment without a backend catch-all route.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Long-lived Caching for Static Assets
    # CRA fingerprints all JS/CSS/media filenames with a content hash, e.g.
    #   main.3f2a4c.chunk.js
    # Because the filename changes when content changes, it is safe to cache
    # these files for a very long time (1 year). Browsers will automatically
    # fetch the new file when the filename (hash) changes.
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;    # Skip logging for static assets (reduces log noise).
    }

    # -------------------------------------------------------------------------
    # Security: Deny Access to Hidden Files
    # Prevents accidental exposure of .env files, .git directories, .htaccess,
    # and similar hidden files that should never be publicly accessible.
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # Error Pages
    # Redirect 404 errors back to index.html so React Router handles them.
    # -------------------------------------------------------------------------
    error_page 404 /index.html;

    # -------------------------------------------------------------------------
    # Security Headers
    # Basic hardening headers suitable for a containerised staging environment.
    # In production, these should be set at the CloudFront / ALB layer as well.
    # -------------------------------------------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
}
